<div class="container my-5">
  <div class="text-center mb-5">
    <h2 class="fw-bold">NUESTROS SERVICIOS</h2>
    <div class="border-bottom border-4 border-danger mx-auto mt-2" style="width: 120px"></div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-10">
      @for (servicio of servicios; track servicio.id; let i = $index) {
        <div class="card mb-4 shadow-lg border-1 overflow-hidden">
          <div class="row g-0 align-items-center">
            <div class="col-md-5 " [class.order-md-2]="i % 2 !== 0">
              <img
                [src]="servicio.image"
                [alt]="servicio.alt"
                class="img-fluid w-100 h-100 object-fit-cover"
                style="min-height: 250px"
              />
            </div>

            <div class="col-md-7" [class.order-md-1]="i % 2 !== 0">
              <div class="card-body p-4 p-lg-5">
                <h3 class="card-title fw-bold text-danger mb-3">
                  {{ servicio.titulo }}
                </h3>
                <p class="card-text text-muted fs-5 mb-4">
                  {{ servicio.descripcion }}
                </p>
                <p class="card-text mb-4">
                  <small class="text-body-secondary">
                    <i class="bi bi-clock me-1" aria-hidden="true"></i> Actualizado recientemente
                  </small>
                </p>
                <a
                  [href]="'/servicio-' + servicio.tipo"
                  class="btn btn-danger px-4 py-2 fw-semibold"
                  role="button"
                >
                  Ver más
                </a>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
