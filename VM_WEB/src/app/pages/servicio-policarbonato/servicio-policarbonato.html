<div class="container text-center mb-5">
  <h2 class="fw-bold display-5 text-dark">Policarbonatos</h2>
  <p class="text-muted fs-5">Techos en sol y sombra, tragaluces, coberturas y más.</p>
  <div class="border-bottom border-4 border-danger mx-auto mt-2" style="width: 100px"></div>
</div>

<div class="container mb-5">
  @for (carrusel of carruseles; track carrusel.id) {
    <div class="mb-5">
      <h4 class="fw-bold mb-3 text-secondary ps-2 border-start border-4 border-danger">
        {{ carrusel.titulo }}
      </h4>

      <div
        [id]="carrusel.id"
        class="carousel slide shadow-sm rounded overflow-hidden bg-light p-3"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner">
          @for (pagina of carrusel.paginas; track $index) {
            <div class="carousel-item" [class.active]="$index === 0">
              <div class="row g-3 justify-content-center">
                @for (item of pagina; track $index) {
                  <div
                    class="col-md-4 col-sm-6"
                    [class.d-none]="$index === 2"
                    [class.d-md-block]="$index === 2"
                  >
                    <div class="card h-100 border-0 shadow-sm">
                      <img
                        [src]="item.img"
                        [alt]="item.alt"
                        class="card-img-top object-fit-cover"
                        style="height: 220px"
                      />
                    </div>
                  </div>
                }
              </div>
            </div>
          }
        </div>

        <button
          class="carousel-control-prev"
          type="button"
          [attr.data-bs-target]="'#' + carrusel.id"
          data-bs-slide="prev"
        >
          <span
            class="carousel-control-prev-icon bg-dark rounded-circle p-3"
            aria-hidden="true"
          ></span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          [attr.data-bs-target]="'#' + carrusel.id"
          data-bs-slide="next"
        >
          <span
            class="carousel-control-next-icon bg-dark rounded-circle p-3"
            aria-hidden="true"
          ></span>
        </button>
      </div>
    </div>
  }
</div>
